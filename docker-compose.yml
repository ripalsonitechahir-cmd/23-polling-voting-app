services:
  app:
    build: .
    image: polling-voting-app:latest
    container_name: polling-voting-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "file:/data/polls.db"
      VOTER_HASH_SALT: "${VOTER_HASH_SALT:-change-me}"
    volumes:
      - polls-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  polls-data:
