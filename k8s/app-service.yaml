# Internal, stable name + load balancing across replicas.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: polling-voting-app
spec:
  type: ClusterIP
  selector:
    app: polling-voting-app
  ports:
    - port: 80
      targetPort: 3000
---
# External access: http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: app-nodeport
  namespace: polling-voting-app
spec:
  type: NodePort
  selector:
    app: polling-voting-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
